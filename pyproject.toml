[project]
name = "retail-refund-agent"
version = "0.1.0"
description = "Policy-enforcing retail refund agent using local Gemma via Ollama"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.5.0",
    "litellm>=1.65.0",
    "orjson>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
